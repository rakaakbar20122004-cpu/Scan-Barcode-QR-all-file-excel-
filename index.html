<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SCAN QR PRO - ARINI</title>

    <!-- Pustaka Eksternal -->
    <script
      src="https://unpkg.com/html5-qrcode"
      type="text/javascript"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --header-bg: rgba(15, 23, 42, 0.7);
        --primary: #3b82f6;
        --primary-glow: 0 0 20px rgba(59, 130, 246, 0.5);
        --success: #10b981;
        --success-glow: 0 0 20px rgba(16, 185, 129, 0.5);
        --danger: #ef4444;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: rgba(255, 255, 255, 0.1);
      }

      [data-theme="light"] {
        --bg-color: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.85);
        --header-bg: rgba(255, 255, 255, 0.8);
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Plus Jakarta Sans", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        padding-bottom: 110px;
        min-height: 100vh;
        transition: background-color 0.3s, color 0.3s;
      }

      /* Header */
      .header {
        background: var(--header-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 16px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 50;
        border-bottom: 1px solid var(--border-color);
      }
      .header h1 {
        font-size: 18px;
        font-weight: 800;
      }
      .header-tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .icon-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 8px 12px;
        border-radius: 20px;
        font-size: 13px;
        cursor: pointer;
        font-weight: 600;
      }

      /* Ringkasan Statistik */
      .stats-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 16px 20px 0 20px;
      }
      .stat-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 12px;
        border-radius: 16px;
        text-align: center;
      }
      .stat-value {
        font-size: 18px;
        font-weight: 800;
        color: var(--primary);
      }
      .stat-label {
        font-size: 10px;
        color: var(--text-muted);
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 2px;
      }

      /* Scanner Box */
      .scanner-wrapper {
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .scanner-container {
        background: #000;
        width: 100%;
        max-width: 400px;
        height: 350px;
        position: relative;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      #reader {
        width: 100%;
        height: 100%;
      }

      .laser {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--primary);
        box-shadow: 0 0 15px 5px rgba(59, 130, 246, 0.8);
        animation: scanline 2.5s infinite linear;
        display: none;
        z-index: 10;
      }
      @keyframes scanline {
        0% { top: 0; opacity: 0; }
        50% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
      .scanner-container.active .laser { display: block; }

      .scanner-overlay {
        position: absolute;
        bottom: 16px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 8px;
        z-index: 15;
      }

      /* Buttons */
      .btn-3d {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        transition: transform 0.1s;
      }
      .btn-3d:active { transform: scale(0.96); }
      .btn-success { background: var(--success); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
      .btn-danger { background: var(--danger); }
      .btn-secondary { background: #64748b; }

      /* Control Bar */
      .control-bar {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
        max-width: 400px;
      }
      .control-bar button, .control-bar label {
        flex: 1;
        text-align: center;
        font-size: 12px;
        padding: 8px;
        border-radius: 12px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        cursor: pointer;
        font-weight: 600;
      }

      /* Search Bar */
      .search-box {
        padding: 0 20px;
        margin-top: 10px;
      }
      .search-input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        background: var(--card-bg);
        color: var(--text-main);
        font-size: 13px;
        outline: none;
      }

      /* Data List */
      .list-container { padding: 20px; }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 12px;
        position: relative;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }
      .data-row {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 6px;
        border-bottom: 1px dashed var(--border-color);
        padding-bottom: 4px;
      }
      .data-label { color: var(--text-muted); font-weight: 600; }
      .data-val { font-weight: 700; text-align: right; word-break: break-word; }
      .card-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        font-size: 11px;
      }
      .action-btns button {
        background: none;
        border: none;
        font-size: 14px;
        cursor: pointer;
        margin-left: 8px;
      }

      /* Modal Pop-up */
      .modal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }
      .modal-content {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        padding: 24px;
        border-radius: 24px;
        width: 85%;
        max-width: 360px;
        color: var(--text-main);
      }
      .modal-content h3 { font-size: 16px; margin-bottom: 12px; }

      /* Floating Action Buttons */
      .fab-container {
        position: fixed;
        bottom: 0; left: 0; width: 100%;
        background: var(--header-bg);
        backdrop-filter: blur(15px);
        padding: 16px 20px;
        display: flex;
        gap: 10px;
        border-top: 1px solid var(--border-color);
        z-index: 40;
      }
      .fab-container button { flex: 1; }

      /* Toast */
      #toast {
        position: fixed;
        top: 70px; left: 50%;
        transform: translateX(-50%) translateY(-20px);
        background: var(--success);
        color: white;
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 12px;
        font-weight: 700;
        z-index: 999;
        opacity: 0;
        transition: all 0.3s;
        pointer-events: none;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>

    <!-- Container Tersembunyi untuk Proses File Scan -->
    <div id="file-scanner-temp" style="display: none;"></div>

    <!-- Header -->
    <div class="header">
      <h1>Scan QR Pro</h1>
      <div class="header-tools">
        <button class="icon-btn" onclick="toggleTheme()">🌗</button>
        <button class="icon-btn" onclick="openArchiveModal()">📁 Arsip</button>
      </div>
    </div>

    <!-- Ringkasan Statistik -->
    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-value" id="statTotalScan">0</div>
        <div class="stat-label">Total Scan</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statTotalQty">0</div>
        <div class="stat-label">Total Qty</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statUniqueItem">0</div>
        <div class="stat-label">Item Unik</div>
      </div>
    </div>

    <!-- Area Scanner -->
    <div class="scanner-wrapper">
      <div class="scanner-container" id="scanBox">
        <div class="laser"></div>
        <div id="reader"></div>
        <div class="scanner-overlay">
          <button class="btn-3d" id="camToggleBtn" onclick="toggleScanner()">📷 Mulai Scanner</button>
        </div>
      </div>

      <!-- Controls Bar -->
      <div class="control-bar">
        <button onclick="toggleTorch()">🔦 Senter ON/OFF</button>
        <label for="qrFileInput">🖼️ Upload Gambar</label>
        <input type="file" id="qrFileInput" accept="image/*" style="display:none;" onchange="scanFromFile(this)">
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari data hasil scan..." oninput="renderList()">
    </div>

    <!-- List Data -->
    <div class="list-container">
      <div id="scanList"></div>
    </div>

    <!-- Floating Buttons -->
    <div class="fab-container">
      <button class="btn-3d btn-success" onclick="exportToExcel()">📥 Export Excel</button>
      <button class="btn-3d" onclick="shareData()">🔗 Share File</button>
    </div>

    <!-- Toast Notification -->
    <div id="toast">✅ Notification</div>

    <!-- Modal Lihat Arsip Tanggal -->
    <div class="modal" id="archiveModal">
      <div class="modal-content">
        <h3>Arsip Riwayat Tanggal</h3>
        <div id="archiveList" style="max-height: 200px; overflow-y: auto; margin-bottom: 12px;"></div>
        <button class="btn-3d btn-secondary" style="width: 100%;" onclick="closeArchiveModal()">Tutup</button>
      </div>
    </div>

    <script>
      let html5QrCode;
      let isScanning = false;
      let todayData = [];
      let torchOn = false;

      window.onload = () => {
        checkDailyReset();
        loadTodayData();
        initTheme();
      };

      // --- TEMA GELAP / TERANG ---
      function initTheme() {
        const theme = localStorage.getItem("app_theme") || "dark";
        document.documentElement.setAttribute("data-theme", theme);
      }
      function toggleTheme() {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("app_theme", next);
      }

      // --- AUDIO FEEDBACK & TTS ---
      function playBeepSound() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(1000, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
      }

      function speakText(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'id-ID';
          utterance.rate = 1.0;
          window.speechSynthesis.speak(utterance);
        }
      }

      // --- MANAJEMEN DATA & RESET HARIAN ---
      function getFormattedDate() {
        return new Date().toLocaleDateString("id-ID", { day: "2-digit", month: "long", year: "numeric" });
      }

      function checkDailyReset() {
        const today = new Date().toLocaleDateString("id-ID");
        const savedDate = localStorage.getItem("nexus_scan_date");

        if (savedDate && savedDate !== today) {
          let oldData = JSON.parse(localStorage.getItem("nexus_today_data") || "[]");
          if (oldData.length > 0) {
            let archive = JSON.parse(localStorage.getItem("nexus_archive_db") || "{}");
            archive[savedDate] = oldData;
            localStorage.setItem("nexus_archive_db", JSON.stringify(archive));
          }
          localStorage.setItem("nexus_today_data", JSON.stringify([]));
        }
        localStorage.setItem("nexus_scan_date", today);
      }

      function loadTodayData() {
        todayData = JSON.parse(localStorage.getItem("nexus_today_data") || "[]");
        renderList();
      }

      // --- SCANNER CONTROLLER ---
      function toggleScanner() {
        if (isScanning) stopScanner();
        else startScanner();
      }

      function startScanner() {
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

        const config = { 
          fps: 15, 
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1.0
        };

        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
          .then(() => {
            isScanning = true;
            document.getElementById("camToggleBtn").innerText = "❌ Tutup Scanner";
            document.getElementById("camToggleBtn").className = "btn-3d btn-danger";
            document.getElementById("scanBox").classList.add("active");
          })
          .catch(() => alert("Kamera gagal diakses. Pastikan izin kamera aktif."));
      }

      function stopScanner() {
        if (html5QrCode && isScanning) {
          html5QrCode.stop().then(() => {
            isScanning = false;
            document.getElementById("camToggleBtn").innerText = "📷 Mulai Scanner";
            document.getElementById("camToggleBtn").className = "btn-3d";
            document.getElementById("scanBox").classList.remove("active");
          });
        }
      }

      // --- ON SCAN SUCCESS (LANGSUNG PROSES TANPA POP-UP) ---
      function onScanSuccess(decodedText) {
        playBeepSound();
        if (navigator.vibrate) navigator.vibrate([100]);

        // Cek Duplikat
        const isDuplicate = todayData.some(item => item.rawText === decodedText);
        if (isDuplicate) {
          showToast("⚠️ Peringatan: Data ini sudah di-scan!");
          speakText("Peringatan, data duplikat terdeteksi");
          return;
        }

        // Parse Data
        let fields = [];
        let firstVal = decodedText;
        let lines = decodedText.split(/\r?\n/);

        lines.forEach((line) => {
          if (!line.trim()) return;
          let parts = line.split(/[:=]/);
          if (parts.length > 1) {
            let label = parts[0].trim();
            let val = parts.slice(1).join(":").trim();
            fields.push({ label: label, value: val });
            if (firstVal === decodedText) firstVal = val;
          } else {
            fields.push({ label: "Isi / Raw Data", value: line.trim() });
          }
        });

        const newScanData = {
          id: Date.now(),
          rawText: decodedText,
          fields: fields,
          firstVal: firstVal,
          qty: 1,
          note: "-",
          time: new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" })
        };

        // Simpan langsung ke data harian
        todayData.unshift(newScanData);
        localStorage.setItem("nexus_today_data", JSON.stringify(todayData));

        // Feedback Suara
        speakText(`${firstVal} terdeteksi.`);

        renderList();
        showToast("Data Berhasil Disimpan!");
      }

      // --- SENTER (FLASHLIGHT) ---
      function toggleTorch() {
        if (html5QrCode && isScanning) {
          torchOn = !torchOn;
          html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] })
            .catch(() => alert("Lampu Senter tidak didukung pada perangkat ini."));
        } else {
          alert("Nyalakan scanner kamera terlebih dahulu.");
        }
      }

      // --- PERBAIKAN SCAN DARI FILE GAMBAR ---
      function scanFromFile(input) {
        if (input.files && input.files[0]) {
          const imageFile = input.files[0];
          const tempScanner = new Html5Qrcode("file-scanner-temp");

          tempScanner.scanFile(imageFile, true)
            .then(decodedText => {
              onScanSuccess(decodedText);
              tempScanner.clear();
              input.value = "";
            })
            .catch(() => {
              alert("Tidak dapat menemukan QR Code / Barcode pada gambar tersebut. Pastikan posisi gambar jelas dan terang.");
              tempScanner.clear();
              input.value = "";
            });
        }
      }

      // --- EDIT & HAPUS DATA ---
      function deleteCard(id) {
        if (confirm("Hapus baris data ini?")) {
          todayData = todayData.filter(item => item.id !== id);
          localStorage.setItem("nexus_today_data", JSON.stringify(todayData));
          renderList();
          showToast("Data Terhapus!");
        }
      }

      function editCard(id) {
        const item = todayData.find(i => i.id === id);
        if (!item) return;

        const newQty = prompt("Edit Jumlah (Qty):", item.qty || 1);
        if (newQty !== null) {
          item.qty = parseInt(newQty) || 1;
          const newNote = prompt("Edit Catatan:", item.note || "");
          if (newNote !== null) item.note = newNote || "-";

          localStorage.setItem("nexus_today_data", JSON.stringify(todayData));
          renderList();
          showToast("Data Diperbarui!");
        }
      }

      // --- RENDER LIST & STATISTIK ---
      function renderList() {
        const container = document.getElementById("scanList");
        const searchQuery = document.getElementById("searchInput").value.toLowerCase();

        let totalScan = todayData.length;
        let totalQty = todayData.reduce((acc, curr) => acc + (curr.qty || 1), 0);
        let uniqueItems = new Set(todayData.map(i => i.rawText)).size;

        document.getElementById("statTotalScan").innerText = totalScan;
        document.getElementById("statTotalQty").innerText = totalQty;
        document.getElementById("statUniqueItem").innerText = uniqueItems;

        let filteredData = todayData.filter(item => {
          return item.rawText.toLowerCase().includes(searchQuery) ||
                 (item.note && item.note.toLowerCase().includes(searchQuery));
        });

        if (filteredData.length === 0) {
          container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size:13px;">Data tidak ditemukan.</div>`;
          return;
        }

        container.innerHTML = "";
        filteredData.forEach((item) => {
          let rowsHtml = "";
          if (item.fields) {
            item.fields.forEach(f => {
              rowsHtml += `<div class="data-row"><span class="data-label">${f.label}</span><span class="data-val">${f.value}</span></div>`;
            });
          }

          container.innerHTML += `
            <div class="card">
              ${rowsHtml}
              <div class="data-row"><span class="data-label">Qty (Jumlah)</span><span class="data-val" style="color:var(--primary);">${item.qty || 1}</span></div>
              <div class="data-row"><span class="data-label">Catatan</span><span class="data-val">${item.note || "-"}</span></div>
              <div class="card-actions">
                <span style="color:var(--text-muted); font-weight:600;">Waktu: ${item.time}</span>
                <div class="action-btns">
                  <button onclick="editCard(${item.id})">✏️</button>
                  <button onclick="deleteCard(${item.id})">🗑️</button>
                </div>
              </div>
            </div>
          `;
        });
      }

      // --- ARSIP TANGGAL SEBELUMNYA ---
      function openArchiveModal() {
        const archive = JSON.parse(localStorage.getItem("nexus_archive_db") || "{}");
        const archiveList = document.getElementById("archiveList");
        archiveList.innerHTML = "";

        const dates = Object.keys(archive);
        if (dates.length === 0) {
          archiveList.innerHTML = `<div style="font-size:12px; color:var(--text-muted);">Belum ada arsip hari sebelumnya.</div>`;
        } else {
          dates.forEach(d => {
            archiveList.innerHTML += `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-color);">
                <span style="font-size:12px; font-weight:700;">${d} (${archive[d].length} scan)</span>
                <button class="btn-3d" style="font-size:10px; padding:4px 8px;" onclick="exportArchiveDate('${d}')">📥 Excel</button>
              </div>
            `;
          });
        }
        document.getElementById("archiveModal").style.display = "flex";
      }

      function closeArchiveModal() {
        document.getElementById("archiveModal").style.display = "none";
      }

      function exportArchiveDate(dateStr) {
        const archive = JSON.parse(localStorage.getItem("nexus_archive_db") || "{}");
        const dataArr = archive[dateStr];
        if (dataArr) generateAndDownloadExcel(dataArr, `Scan_Arsip_${dateStr.replace(/ /g, "_")}.xlsx`);
      }

      // --- EXPORT TO EXCEL ---
      function prepareExcelData(dataArray) {
        return dataArray.map((item, index) => {
          let rowObj = { "No": index + 1 };
          if (item.fields) {
            item.fields.forEach(f => { rowObj[f.label] = f.value; });
          } else {
            rowObj["Raw Data"] = item.rawText;
          }
          rowObj["Jumlah (Qty)"] = item.qty || 1;
          rowObj["Catatan"] = item.note || "-";
          rowObj["Waktu Scan"] = item.time;
          return rowObj;
        });
      }

      function generateAndDownloadExcel(dataArray, fileName) {
        const excelData = prepareExcelData(dataArray);
        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Hasil Scan");

        const excelBuffer = XLSX.write(workbook, { bookType: "xlsx", type: "array" });
        const fileBlob = new Blob([excelBuffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

        const url = window.URL.createObjectURL(fileBlob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        a.click();
        window.URL.revokeObjectURL(url);
      }

      function exportToExcel() {
        if (todayData.length === 0) return alert("⚠️ Data hari ini masih kosong.");
        generateAndDownloadExcel(todayData, `Scan_Kedatangan_${getFormattedDate().replace(/ /g, "_")}.xlsx`);
      }

      async function shareData() {
        if (todayData.length === 0) return alert("⚠️ Data hari ini masih kosong.");

        const excelData = prepareExcelData(todayData);
        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Hasil Scan");

        const excelBuffer = XLSX.write(workbook, { bookType: "xlsx", type: "array" });
        const fileName = `Scan_Kedatangan_${getFormattedDate().replace(/ /g, "_")}.xlsx`;
        const file = new File([excelBuffer], fileName, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: "Laporan Scan Material" });
          } catch (e) {}
        } else {
          alert("Gunakan tombol 'Export Excel' untuk browser ini.");
        }
      }

      function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
      }
    </script>
  </body>
</html>
